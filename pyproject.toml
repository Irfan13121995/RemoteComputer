[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "remote-computer"
version = "1.0.0"
description = "Self-Hosted Web-Based Remote Desktop Application"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "websockets>=12.0",
    "mss>=9.0.1",
    "pynput>=1.7.6",
    "pillow>=10.0.0",
    "pyperclip>=1.8.2",
    "cryptography>=42.0.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
remote-host = "server.cli:main"
